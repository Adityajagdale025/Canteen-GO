{% extends 'base.html' %}
{% block title %}Rate Your Order | CanteenGo{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border">
    <h2 class="text-xl font-extrabold mb-1">⭐ Rate Your CanteenGo Experience</h2>
    <p class="text-xs text-slate-500 mb-4">Token {{ order.token_number }} • {{ order.created_at|date:"d M Y" }}</p>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Rating</label>
            <select name="rating" class="w-full border rounded-xl p-2.5 text-sm font-bold" required>
                <option value="5" {% if existing.rating == 5 %}selected{% endif %}>⭐⭐⭐⭐⭐ (5 - Loved the food & speed!)</option>
                <option value="4" {% if existing.rating == 4 %}selected{% endif %}>⭐⭐⭐⭐ (4 - Good)</option>
                <option value="3" {% if existing.rating == 3 %}selected{% endif %}>⭐⭐⭐ (3 - Average)</option>
                <option value="2" {% if existing.rating == 2 %}selected{% endif %}>⭐⭐ (2 - Needs Improvement)</option>
                <option value="1" {% if existing.rating == 1 %}selected{% endif %}>⭐ (1 - Poor)</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Comments / Suggestions</label>
            <textarea name="comment" rows="3" class="w-full border rounded-xl p-3 text-sm" placeholder="How was the food quality and pickup timing?">{{ existing.comment }}</textarea>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold hover:bg-indigo-700">
            Submit Feedback
        </button>
    </form>
</div>
{% endblock %}
